<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Altora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=BBH+Hegarty&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <h1>Altora</h1>
  </header>

  <section class="summary-card">
    <p class="summary-text">
      <span id="greeting">Bonjour</span> <img class="avatar" src="avatar.jpg" alt="Jesse"> Jesse, <span class="period-trigger-wrap">
        <button type="button" class="period-trigger" id="period-trigger">
          <span id="period-label">aujourd'hui</span><i data-lucide="chevron-down"></i>
        </button>
        <span class="period-popup hidden" id="period-popup">
          <button type="button" class="period-option active" data-period="today">Aujourd'hui</button>
          <button type="button" class="period-option" data-period="week">Cette semaine</button>
          <button type="button" class="period-option" data-period="month">Ce mois-ci</button>
        </span>
      </span> tu as <span class="inline-pill inline-pill--slate"><i data-lucide="circle-dashed"></i><span id="summary-todo">0</span></span> candidatures à postuler,
      <span class="inline-pill inline-pill--amber"><i data-lucide="hourglass"></i><span id="summary-sent">0</span></span> envoyées,
      <span class="inline-pill inline-pill--green"><i data-lucide="target"></i><span id="summary-interview">0</span></span> entretiens planifiés et
      <span class="inline-pill inline-pill--rose"><i data-lucide="folder-x"></i><span id="summary-rejected">0</span></span> refus reçus.
    </p>
  </section>

  <main class="board" id="board">
    <div class="column" data-status="todo">
      <div class="column-top">
        <span class="stat-pill stat-pill--slate"><i data-lucide="circle-dashed"></i>À postuler</span>
        <button class="add-card-btn" data-status="todo" title="Ajouter une candidature"><i data-lucide="plus"></i></button>
      </div>
      <div class="stat-number-row"><span class="stat-value" id="stat-todo">0</span></div>
      <div class="stat-bar-row">
        <div class="stat-bar-track"><div class="stat-bar-fill stat-bar-fill--slate" id="bar-todo"></div></div>
        <span class="stat-bar-pct" id="pct-todo">0%</span>
      </div>
      <div class="card-list" id="list-todo"></div>
    </div>

    <div class="column" data-status="sent">
      <div class="column-top">
        <span class="stat-pill stat-pill--amber"><i data-lucide="hourglass"></i>Envoyé</span>
        <button class="add-card-btn" data-status="sent" title="Ajouter une candidature"><i data-lucide="plus"></i></button>
      </div>
      <div class="stat-number-row"><span class="stat-value" id="stat-sent">0</span></div>
      <div class="stat-bar-row">
        <div class="stat-bar-track"><div class="stat-bar-fill stat-bar-fill--amber" id="bar-sent"></div></div>
        <span class="stat-bar-pct" id="pct-sent">0%</span>
      </div>
      <div class="card-list" id="list-sent"></div>
    </div>

    <div class="column" data-status="interview">
      <div class="column-top">
        <span class="stat-pill stat-pill--green"><i data-lucide="target"></i>Entretien</span>
        <button class="add-card-btn" data-status="interview" title="Ajouter une candidature"><i data-lucide="plus"></i></button>
      </div>
      <div class="stat-number-row"><span class="stat-value" id="stat-interview">0</span></div>
      <div class="stat-bar-row">
        <div class="stat-bar-track"><div class="stat-bar-fill stat-bar-fill--green" id="bar-interview"></div></div>
        <span class="stat-bar-pct" id="pct-interview">0%</span>
      </div>
      <div class="card-list" id="list-interview"></div>
    </div>

    <div class="column" data-status="rejected">
      <div class="column-top">
        <span class="stat-pill stat-pill--rose"><i data-lucide="folder-x"></i>Refus</span>
        <button class="add-card-btn" data-status="rejected" title="Ajouter une candidature"><i data-lucide="plus"></i></button>
      </div>
      <div class="stat-number-row"><span class="stat-value" id="stat-rejected">0</span></div>
      <div class="stat-bar-row">
        <div class="stat-bar-track"><div class="stat-bar-fill stat-bar-fill--rose" id="bar-rejected"></div></div>
        <span class="stat-bar-pct" id="pct-rejected">0%</span>
      </div>
      <div class="card-list" id="list-rejected"></div>
    </div>
  </main>

  <div class="settings-trigger-wrap">
    <button class="fab settings-fab" id="settings-btn" title="Réglages">
      <i data-lucide="settings"></i>
    </button>
    <div class="theme-popup hidden" id="theme-popup">
      <button type="button" class="theme-option" data-theme="system"><i data-lucide="monitor"></i>Système</button>
      <button type="button" class="theme-option" data-theme="light"><i data-lucide="sun"></i>Clair</button>
      <button type="button" class="theme-option" data-theme="dark"><i data-lucide="moon"></i>Sombre</button>
    </div>
  </div>

  <button class="fab" id="fab-import" title="Importer une offre">
    <i data-lucide="plus"></i>
  </button>

  <div class="modal-overlay hidden" id="modal-overlay">
    <div class="modal">
      <button type="button" class="modal-close" id="btn-close" title="Fermer"><i data-lucide="x"></i></button>
      <h3 id="modal-title">Nouvelle offre</h3>
      <p class="modal-hint hidden" id="modal-hint">Colle le lien de l'offre — tu pourras compléter les détails juste après.</p>
      <form id="card-form">
        <label>Lien de l'offre
          <input type="url" id="field-url" placeholder="https://...">
        </label>
        <label>Poste <span class="field-required">*</span>
          <input type="text" id="field-title" placeholder="Intitulé du poste">
        </label>
        <label>Entreprise
          <input type="text" id="field-company" placeholder="Nom de l'entreprise">
        </label>
        <div class="field-group">
          <span class="field-label">Statut</span>
          <div class="status-picker" id="status-picker">
            <button type="button" class="status-btn status-btn--slate" data-status="todo"><i data-lucide="circle-dashed"></i>À postuler</button>
            <button type="button" class="status-btn status-btn--amber" data-status="sent"><i data-lucide="hourglass"></i>Envoyé</button>
            <button type="button" class="status-btn status-btn--green" data-status="interview"><i data-lucide="target"></i>Entretien</button>
            <button type="button" class="status-btn status-btn--rose" data-status="rejected"><i data-lucide="folder-x"></i>Refus</button>
          </div>
        </div>
        <div class="field-group hidden" id="interview-stage-group">
          <span class="field-label">Étape de l'entretien</span>
          <div class="interview-stage-picker" id="interview-stage-picker">
            <button type="button" class="stage-btn" data-stage="1">1er entretien</button>
            <button type="button" class="stage-btn" data-stage="2">2e entretien</button>
            <button type="button" class="stage-btn" data-stage="final">Entretien final</button>
          </div>
        </div>
        <label>Sans réponse après le
          <input type="date" id="field-deadline">
        </label>
        <div class="field-group">
          <span class="field-label">Contact</span>
          <div id="contacts-list"></div>
          <button type="button" id="btn-add-contact" class="btn-add-contact"><i data-lucide="plus"></i>Ajouter un contact</button>
        </div>
        <label>Notes
          <textarea id="field-notes" rows="3" placeholder="Contact, prochaine étape..."></textarea>
        </label>
        <div class="modal-actions">
          <button type="button" id="btn-delete" class="btn-danger hidden">Supprimer</button>
          <div class="modal-actions-right">
            <button type="button" id="btn-cancel" class="btn-secondary">Annuler</button>
            <button type="submit" class="btn-primary">Enregistrer</button>
          </div>
        </div>
      </form>
    </div>
  </div>

</div>

<div class="grid-overlay" id="grid-overlay"></div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="app.js?v=20"></script>
</body>
</html>
